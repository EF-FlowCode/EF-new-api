# Frontend Development - Backend built from local source
#
# Usage:
#   1. Run .\menu.ps1 or .\scripts\dev.ps1
#   2. Open http://localhost:3001 (Rsbuild dev server, API auto-proxied to :3000)
#
# Backend only:
#   .\scripts\dev.ps1 -BackendOnly
#
# Rebuild backend after Go code changes:
#   docker compose -f docker-compose.dev.yml up -d --build new-api
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# Reset data:
#   .\scripts\dev.ps1 -ResetData

name: new-api

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        BUILD_VERSION: ${BUILD_VERSION:-v0.0.0}
    image: new-api-dev:local
    container_name: new-api-dev
    restart: unless-stopped
    stop_grace_period: 130s
    ports:
      - "3000:3000"
    volumes:
      - dev_data:/data
    environment:
      - SQL_DSN=root:123456@tcp(mysql:3306)/new_api?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
#      - SESSION_COOKIE_SECURE=true
#      - SESSION_COOKIE_TRUSTED_URL=https://dev.example.com
#      - SMTP_STARTTLS_ENABLED=true
#      - SMTP_INSECURE_SKIP_VERIFY=false
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: new-api-dev-redis
    restart: unless-stopped
    networks:
      - dev-network

  mysql:
    image: mysql:8.4.8
    container_name: new-api-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: new_api
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dev_mysql_data:/var/lib/mysql
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  dev_data:
  dev_mysql_data:

networks:
  dev-network:
    driver: bridge
