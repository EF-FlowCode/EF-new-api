<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA: installable web app. The manifest, icons and home-screen title are
         injected at runtime from the deployment's configured System Name + Logo
         (see src/lib/pwa-manifest.ts) — nothing brand-specific is baked here. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#efe7d8" />

    <!-- Runs before external bundles; recovery must not depend on their download. -->
    <script>
      <%= resourceRecoveryScript %>
    </script>
  </head>

  <body>
    <noscript
      >请启用 JavaScript 以使用本应用。Please enable JavaScript to use this
      app.</noscript
    >
    <div id="root"></div>
  </body>
</html>
