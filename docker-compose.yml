# New-API Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    stop_grace_period: 130s
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=root:123456@tcp(mysql:3306)/new-api?charset=utf8mb4&parseTime=True&loc=Local # ⚠️ IMPORTANT: Change the password in production!
      - REDIS_CONN_STRING=redis://:123456@redis:6379 # ⚠️ IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认300秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 300s. Increase if experiencing empty completions）
#      - TASK_PLUGIN_PROTOCOL_TIMEOUT_SECONDS=600  # 任务 Responses 观察时限，不是任务退款时限
#      - TASK_PLUGIN_PROTOCOL_TICK_MILLISECONDS=2000  # 串行读取持久任务状态的间隔
#      - TASK_PLUGIN_PROTOCOL_TICK_JITTER_MILLISECONDS=500  # 间隔附加抖动上限，可为 0
#      - TASK_PLUGIN_PROTOCOL_HEARTBEAT_SECONDS=15  # SSE 注释心跳间隔
#      - RESPONSE_HEADER_TIMEOUT=120  # 等待上游响应头(首字节之前)超时，单位秒，默认0=不限制；只覆盖响应头之前的等待、不影响流式生成，治上游接连接但永不吐响应头挂死 （Wait-for-response-header timeout in seconds; 0=disabled; bounds only the pre-first-byte phase）
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SESSION_COOKIE_SECURE=true  # 启用 Secure 会话 Cookie 时，必须同时设置可信 HTTPS 入口地址
#      - SESSION_COOKIE_TRUSTED_URL=https://example.com  # 多个入口地址用英文逗号分隔
#      - SMTP_STARTTLS_ENABLED=true  # SMTP 显式 STARTTLS；不要与后台 SSL/TLS 模式同时启用
#      - SMTP_INSECURE_SKIP_VERIFY=false  # 生产环境应保持 false，仅受控自签名证书场景开启
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - mysql
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ IMPORTANT: Change this password in production!
    networks:
      - new-api-network

  mysql:
    image: mysql:8.4.8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
      MYSQL_DATABASE: new-api
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - new-api-network
#    ports:
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

volumes:
  mysql_data:

networks:
  new-api-network:
    driver: bridge
